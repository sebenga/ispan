# iSpan — Render Blueprint (Frankfurt)
# SPA is built into the API Docker image and served by Django/WhiteNoise.
#
# Note: this workspace already has a Free Postgres + Free Key Value (Fair Measure),
# so iSpan uses the smallest paid datastore plans.

envVarGroups:
  - name: ispan-secrets
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: PAYMENTS_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: ispan-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: ispan
    user: ispan

services:
  - type: keyvalue
    name: ispan-kv
    plan: 256mb
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: ispan-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - fromGroup: ispan-secrets
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: https://ispan-api.onrender.com,https://ispan-api-2oct.onrender.com
      - key: PUBLIC_APP_ORIGIN
        value: https://ispan-api.onrender.com
      - key: PUBLIC_API_ORIGIN
        value: https://ispan-api.onrender.com
      - key: PUBLIC_REALTIME_ORIGIN
        value: https://ispan-realtime.onrender.com
      - key: LEGAL_VERSION
        value: "2026-11-19"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: KYC_PROVIDER
        value: mock
      - key: SMS_PROVIDER
        value: mock
      - key: FEATURE_PARTNER_OFFERS
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "false"
      - key: SPA_DIR
        value: /app/spa
      - key: SEED_ON_BOOT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ispan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ispan-kv
          type: keyvalue
          property: connectionString

  - type: web
    name: ispan-realtime
    runtime: node
    plan: free
    region: frankfurt
    rootDir: realtime
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - fromGroup: ispan-secrets
      - key: REDIS_URL
        fromService:
          name: ispan-kv
          type: keyvalue
          property: connectionString
      - key: REALTIME_EVENT_CHANNEL
        value: ispan:events
      - key: REALTIME_CORS_ORIGINS
        value: https://ispan-api.onrender.com,https://ispan-api-2oct.onrender.com
