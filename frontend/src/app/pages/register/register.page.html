<ion-content [fullscreen]="true" class="register-content">
  <div class="stage">
    <div class="visual">
      <img src="assets/brand/join-crew.jpg" alt="Cape Town people joining iSpan" />
      <div class="visual-fade"></div>
      <button type="button" class="back" routerLink="/login" (click)="tap()">← Back</button>
      <p class="brand-mark">iSpan</p>
    </div>

    <div class="panel">
      <h1>Join the crew</h1>
      <p class="muted">Create an account to book trusted trades — or take jobs as an independent worker.</p>

      <ion-list lines="full" class="form">
        <ion-item>
          <ion-input
            label="First name"
            labelPlacement="stacked"
            autocomplete="given-name"
            [(ngModel)]="first_name"
            name="first_name"
            (ionFocus)="unlockAudio()"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Last name"
            labelPlacement="stacked"
            autocomplete="family-name"
            [(ngModel)]="last_name"
            name="last_name"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Email"
            labelPlacement="stacked"
            type="email"
            autocomplete="email"
            [(ngModel)]="email"
            name="email"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Mobile"
            labelPlacement="stacked"
            type="tel"
            inputmode="tel"
            placeholder="082 123 4567"
            autocomplete="tel"
            [(ngModel)]="phone"
            name="phone"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Password (min 8 characters)"
            labelPlacement="stacked"
            type="password"
            autocomplete="new-password"
            [(ngModel)]="password"
            name="password"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-select label="I am a…" labelPlacement="stacked" [(ngModel)]="role" name="role" (ionChange)="tap()">
            <ion-select-option value="CUSTOMER">Customer — I need help</ion-select-option>
            <ion-select-option value="WORKER">Worker — I take jobs</ion-select-option>
          </ion-select>
        </ion-item>
      </ion-list>

      <p class="error" *ngIf="error">{{ error }}</p>

      <ion-button expand="block" class="primary" type="button" (click)="submit()" [disabled]="loading">
        {{ loading ? 'Creating…' : 'Create account' }}
      </ion-button>

      <ion-button expand="block" fill="clear" class="ghost" routerLink="/login" (click)="tap()">
        Already have an account?
      </ion-button>
    </div>
  </div>
</ion-content>
