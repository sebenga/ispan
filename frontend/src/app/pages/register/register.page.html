<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Join iSpan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-input label="First name" labelPlacement="stacked" [(ngModel)]="first_name"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Last name" labelPlacement="stacked" [(ngModel)]="last_name"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Email" labelPlacement="stacked" type="email" [(ngModel)]="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Mobile" labelPlacement="stacked" type="tel" [(ngModel)]="phone"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Password" labelPlacement="stacked" type="password" [(ngModel)]="password"></ion-input>
    </ion-item>
    <ion-item>
      <ion-select label="I am a…" labelPlacement="stacked" [(ngModel)]="role">
        <ion-select-option value="CUSTOMER">Customer</ion-select-option>
        <ion-select-option value="WORKER">Worker</ion-select-option>
      </ion-select>
    </ion-item>
  </ion-list>

  <p class="error" *ngIf="error">{{ error }}</p>
  <ion-button expand="block" (click)="submit()" [disabled]="loading">
    {{ loading ? 'Creating…' : 'Create account' }}
  </ion-button>
</ion-content>
