<ion-header>
  <ion-toolbar color="dark">
    <ion-title>
      <ion-icon name="log-in-outline"></ion-icon>
      iSpan
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="banner" *ngIf="paymentTestMode">
    <ion-badge color="warning">Test mode</ion-badge>
  </div>

  <h1>Welcome back</h1>
  <p class="muted">Log in to book a worker or take jobs.</p>

  <ion-list lines="full">
    <ion-item>
      <ion-input label="Email" labelPlacement="stacked" type="email" [(ngModel)]="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input
        label="Password"
        labelPlacement="stacked"
        type="password"
        [(ngModel)]="password"
      ></ion-input>
    </ion-item>
  </ion-list>

  <p class="error" *ngIf="error">{{ error }}</p>

  <ion-button expand="block" (click)="submit()" [disabled]="loading">
    {{ loading ? 'Signing in…' : 'Log in' }}
  </ion-button>

  <ion-button expand="block" fill="clear" routerLink="/register">Create account</ion-button>
</ion-content>
