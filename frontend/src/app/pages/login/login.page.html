<ion-content [fullscreen]="true" class="login-content">
  <div class="stage">
    <div class="visual">
      <img src="assets/brand/worker-portrait.jpg" alt="Independent Cape Town tradesperson" />
      <div class="visual-fade"></div>
      <p class="brand-mark">iSpan</p>
    </div>

    <div class="panel">
      <div class="banner" *ngIf="paymentTestMode">
        <ion-badge color="warning">Test mode</ion-badge>
      </div>

      <h1>Welcome back</h1>
      <p class="muted">Log in to book a worker or take jobs across Cape Town.</p>

      <ion-list lines="full" class="form">
        <ion-item>
          <ion-input
            label="Email"
            labelPlacement="stacked"
            type="email"
            [(ngModel)]="email"
            (ionFocus)="unlockAudio()"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Password"
            labelPlacement="stacked"
            type="password"
            [(ngModel)]="password"
          ></ion-input>
        </ion-item>
      </ion-list>

      <p class="error" *ngIf="error">{{ error }}</p>

      <ion-button expand="block" class="primary" (click)="submit()" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Log in' }}
      </ion-button>

      <ion-button expand="block" fill="clear" class="ghost" routerLink="/register" (click)="tap()">
        Create account
      </ion-button>
    </div>
  </div>
</ion-content>
